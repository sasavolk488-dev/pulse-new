name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip source.zip -d project_folder
          # Выводим список файлов для диагностики
          ls -R project_folder

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          # Ищем, где именно лежит файл gradlew
          GRADLEW_DIR=$(find project_folder -name "gradlew" -type f -exec dirname {} \; | head -n 1)
          echo "Gradle project found in: $GRADLEW_DIR"
          if [ -z "$GRADLEW_DIR" ]; then
            echo "Ошибка: файл gradlew не найден внутри архива!"
            exit 1
          fi
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pulse-new-jar
          path: project_folder/**/build/libs/*.jar
